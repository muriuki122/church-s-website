version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: church-backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - instance_data:/app/instance
    environment:
      - SECRET_KEY=kaloleni_church_secret_key_123
      - FLASK_APP=app.py
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: church-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  instance_data:
